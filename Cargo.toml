[package]
name = "ferrite-apogee"
version = "0.1.0"
description = "NASA Astronomy Picture of the Day, rendered through Ferrite dither."
license = "Apache-2.0"
authors = ["Ryan Wetzstein"]
repository = "https://github.com/rwetz/ferrite-apogee"
readme = "README.md"
edition = "2024"
rust-version = "1.92"

[dependencies]
serde_json = "1"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "ca37602228165b6c2bf50b075d9bcf8d4bbd233f" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
